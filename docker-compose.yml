services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules # Evita que el node_modules de Windows pise al de Linux del contenedor
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - ALLOWED_ORIGINS=http://localhost:5173
      - CHOKIDAR_USEPOLLING=true # Hot reload confiable en Docker + Windows

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
